name: Mimer
options:
  bundleIdPrefix: com.hasanjafri
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 6 toolchain, Swift 5 language mode for the scaffold.
    # Migrate to Swift 6 language mode in Phase 1 with the concurrency-sensitive monitor.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete   # surface data-race issues now (Swift 6 prep)
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"   # local-dev placeholder; releases set CFBundleVersion to the git commit count (see scripts/release.sh)
    DEVELOPMENT_TEAM: ""              # set when configuring Developer ID signing
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES      # required for notarized direct distribution

packages:
  # Pinned to exact versions (not `from:` ranges) so a release can't pull a newer —
  # possibly compromised — dependency into a signed, notarized, auto-updated build.
  # Bump these deliberately and re-verify.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.3"

targets:
  Mimer:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mimer
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # Bundle the CLI + MCP binaries into the app (Contents/Resources) with Code Sign On
      # Copy, so a notarized release ships them signed and `brew` users get them without
      # building. NOTE: destination is Resources, NOT Executables (Contents/MacOS) — the
      # binary `mimer` would collide with the app's own `Mimer` executable on case-insensitive
      # APFS and clobber it. CLITools resolves them from Bundle.main.resourceURL.
      - target: MimerCLI
        codeSign: true
        copy:
          destination: resources
      - target: MimerMCP
        codeSign: true
        copy:
          destination: resources
    info:
      path: Sources/Mimer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true                       # menu-bar agent, no Dock icon
        NSHumanReadableCopyright: "Mimer — MIT-licensed."
        SUFeedURL: https://raw.githubusercontent.com/hasanjafri/Mimer/main/appcast.xml
        SUPublicEDKey: szbZAEoKZV3tF8/RllVeBtnZHgBs/D4gpRIjFftjC6k=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasanjafri.Mimer
        PRODUCT_NAME: Mimer
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Mimer.entitlements   # hardened runtime; sandbox explicitly off
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MimerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MimerTests
    dependencies:
      - target: Mimer
      - target: MimerCLI       # build-order only: ensures the CLI binary exists for MimerCLITests
      - target: MimerMCP       # build-order only: ensures the MCP binary exists for MimerMCPTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasanjafri.MimerTests
        GENERATE_INFOPLIST_FILE: YES

  # `mimer` command-line tool. Shares ClipTransform.swift verbatim with the app
  # (no dependency on the app target, no KeyboardShortcuts/Sparkle) so the transform
  # engine has one source of truth. Pure Foundation; touches no clipboard history.
  # Target is MimerCLI (not `mimer`) to avoid a case-insensitive-filesystem clash
  # with the Mimer app's swiftmodule; PRODUCT_NAME keeps the binary named `mimer`.
  MimerCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MimerCLI
      - path: Sources/Mimer/ClipTransform.swift
    settings:
      base:
        PRODUCT_NAME: mimer                # the invoked binary is `mimer`
        PRODUCT_MODULE_NAME: MimerCLI       # module name must differ from `Mimer` — else mimer.swiftmodule clobbers Mimer.swiftmodule on case-insensitive APFS
        PRODUCT_BUNDLE_IDENTIFIER: com.hasanjafri.mimer-cli
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES                   # embed via the app's copy phase only — do NOT add a loose /usr/local/bin product to the archive (breaks -exportArchive method detection)

  # `mimer-mcp` — the Model Context Protocol server (stdio JSON-RPC). Shares
  # ClipTransform.swift (transforms) and MCPWire.swift (the app IPC protocol) with the
  # app; talks to the running app over a local Mach port for history tools. Same
  # module-name caution as MimerCLI.
  MimerMCP:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MimerMCP
      - path: Sources/Mimer/ClipTransform.swift
      - path: Sources/Mimer/MCPWire.swift
    settings:
      base:
        PRODUCT_NAME: mimer-mcp
        PRODUCT_MODULE_NAME: MimerMCP
        PRODUCT_BUNDLE_IDENTIFIER: com.hasanjafri.mimer-mcp
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES                   # embed via the app's copy phase only — see MimerCLI note

schemes:
  Mimer:
    build:
      targets:
        Mimer: all
        MimerTests: [test]
        # MimerCLI / MimerMCP build automatically as app copy-dependencies (and as
        # MimerTests deps for the integration tests) — no explicit entry needed.
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MimerTests
